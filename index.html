<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registo Operacional · Delivery Express</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0b0d12; min-height: 100vh; }
  #de-app-root { border-radius: 0 !important; min-height: 100vh !important; }
  #de-app-root {
    --navy: #0b0d12;
    --panel: #14161d;
    --panel-raised: #1b1e27;
    --border: #232631;
    --blue: #3b6fe0;
    --blue-dim: #2451ad;
    --blue-glow: rgba(59,111,224,0.16);
    --text: #eef0f4;
    --text-dim: #8d94a3;
    --text-faint: #5c626f;
    --green: #22c274;
    --red: #e5484d;
    --shadow-sm: 0 2px 8px rgba(0,0,0,0.28);
    --shadow-md: 0 6px 18px rgba(0,0,0,0.32);
    --shadow-lg: 0 16px 40px rgba(0,0,0,0.45);
    --header-bg: radial-gradient(ellipse at top left, rgba(59,111,224,0.16), transparent 55%), linear-gradient(180deg, var(--panel-raised), var(--panel));
    --hero-bg: radial-gradient(ellipse at top left, rgba(59,111,224,0.22), transparent 60%), linear-gradient(135deg, var(--panel-raised), var(--panel));
    --card-bg: linear-gradient(180deg, rgba(27,30,39,0.5), rgba(20,22,29,0.5)), var(--panel);
    --input-bg: var(--navy);
    --row-hover: rgba(59,111,224,0.06);
    --logo-chip-bg: #ffffff;
    --table-border: rgba(35,38,49,0.7);
    --font-ui: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    --font-mono: 'JetBrains Mono', 'SF Mono', Consolas, monospace;

    background: var(--navy);
    color: var(--text);
    font-family: var(--font-ui);
    border-radius: 12px;
    overflow: hidden;
    min-height: 600px;
    display: flex;
    flex-direction: column;
    box-sizing: border-box;
    transition: background .25s ease, color .25s ease;
  }
  #de-app-root[data-theme="light"] {
    --navy: #f7f8fa;
    --panel: #ffffff;
    --panel-raised: #ffffff;
    --border: #e5e8ef;
    --blue: #3b6fe0;
    --blue-dim: #2451ad;
    --blue-glow: rgba(59,111,224,0.12);
    --text: #12141c;
    --text-dim: #666d7d;
    --text-faint: #9298a6;
    --green: #0a9d5c;
    --red: #d4383f;
    --shadow-sm: 0 1px 2px rgba(20,24,34,0.04), 0 1px 1px rgba(20,24,34,0.03);
    --shadow-md: 0 4px 14px rgba(20,24,34,0.06), 0 1px 3px rgba(20,24,34,0.04);
    --shadow-lg: 0 12px 32px rgba(20,24,34,0.10), 0 4px 10px rgba(20,24,34,0.05);
    --header-bg: linear-gradient(180deg, #ffffff, #f6f8fc);
    --hero-bg: radial-gradient(ellipse at top left, rgba(59,111,224,0.10), transparent 60%), linear-gradient(135deg, #ffffff, #f1f5fd);
    --card-bg: #ffffff;
    --input-bg: #f1f3f6;
    --row-hover: rgba(59,111,224,0.045);
    --logo-chip-bg: #ffffff;
    --table-border: #e5e8ef;
  }
  #de-app-root * { box-sizing: border-box; }
  #de-app-root, #de-app-root * { transition: background-color .2s ease, border-color .2s ease, color .2s ease, box-shadow .2s ease; }

  .de-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 24px; border-bottom: 1px solid var(--border);
    background: var(--header-bg);
    flex-wrap: wrap; gap: 10px;
  }
  .de-brand { display: flex; align-items: center; gap: 12px; }
  .de-brand .logo-mark {
    width: 34px; height: 34px; border-radius: 9px;
    background: linear-gradient(135deg, var(--blue), var(--blue-dim));
    display: flex; align-items: center; justify-content: center;
    font-weight: 900; font-size: 14px; color: #fff; letter-spacing: -0.5px;
    box-shadow: 0 0 0 1px rgba(59,111,224,0.35), 0 6px 18px rgba(59,111,224,0.3);
  }
  .de-brand .mark { color: #fff; font-weight: 800; letter-spacing: 0.03em; font-size: 15.5px; }
  .de-brand .logo-chip { background: transparent; padding: 0; display: flex; align-items: center; height: 60px; }
  .de-brand .logo-chip img { height: 54px; width: auto; display: block; }
  .de-brand-divider { width: 1px; height: 38px; background: linear-gradient(180deg, transparent, var(--border), transparent); }
  .de-brand-title { display: flex; flex-direction: column; gap: 3px; }
  .de-title-line {
    font-size: 15px; font-weight: 800; letter-spacing: 0.03em; color: var(--text);
    display: flex; align-items: center; gap: 7px;
  }
  .de-title-dot { color: var(--blue); font-weight: 900; }
  .de-brand .sub { color: var(--blue); font-size: 10.5px; font-weight: 700; font-family: var(--font-mono); letter-spacing: 0.14em; margin-top: 0; }

  .de-tabs { display: flex; gap: 4px; background: var(--navy); padding: 4px; border-radius: 10px; border: 1px solid var(--border); }
  .de-tab {
    padding: 8px 16px; font-size: 13px; font-weight: 700; color: var(--text-dim);
    background: transparent; border: none; border-radius: 7px; cursor: pointer;
    transition: all .15s ease; font-family: var(--font-ui);
  }
  .de-tab:hover { color: var(--text); background: rgba(255,255,255,0.03); }
  .de-tab.active { background: linear-gradient(135deg, var(--blue), var(--blue-dim)); color: #fff; box-shadow: 0 3px 10px rgba(59,111,224,0.35); }

  .de-body { flex: 1; overflow-y: auto; padding: 22px; }
  .de-body > div { animation: deFadeIn .28s ease; }
  @keyframes deFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .de-row { display: flex; gap: 14px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 18px; }
  .de-field { display: flex; flex-direction: column; gap: 6px; min-width: 170px; }
  .de-field label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-faint); font-weight: 600; display: flex; align-items: center; gap: 5px; }
  .de-rename-btn {
    background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 11px;
    padding: 0; line-height: 1; opacity: 0.6; transition: opacity .15s, color .15s;
  }
  .de-rename-btn:hover { opacity: 1; color: var(--blue); }
  .de-field select, .de-field input[type="date"], .de-field input[type="text"], .de-field input[type="number"] {
    background: var(--panel); border: 1px solid var(--border); color: var(--text);
    padding: 9px 10px; border-radius: 7px; font-size: 14px; font-family: var(--font-ui);
    outline: none; transition: border-color .15s;
  }
  .de-field select:focus, .de-field input:focus { border-color: var(--blue); }
  .de-field input[type="number"] { font-family: var(--font-mono); }

  .de-btn {
    background: linear-gradient(135deg, var(--blue), var(--blue-dim)); color: #fff; border: none; padding: 10px 18px;
    border-radius: 8px; font-weight: 700; font-size: 13px; cursor: pointer; font-family: var(--font-ui);
    transition: all .15s; box-shadow: 0 3px 10px rgba(59,111,224,0.25);
  }
  .de-btn:hover { transform: translateY(-1px); box-shadow: 0 5px 16px rgba(59,111,224,0.35); }
  .de-btn.ghost { background: transparent; color: var(--text-dim); border: 1px solid var(--border); font-weight: 600; box-shadow: none; }
  .de-btn.ghost:hover { color: var(--text); border-color: var(--blue-dim); transform: none; box-shadow: none; }
  .de-btn.danger { background: transparent; color: var(--red); border: 1px solid rgba(239,90,111,0.4); font-weight: 600; padding: 6px 10px; font-size: 12px; box-shadow: none; }
  .de-btn.danger:hover { background: rgba(239,90,111,0.08); transform: none; }
  .de-btn.small { padding: 6px 12px; font-size: 12px; }
  .de-btn:disabled { opacity: 0.5; cursor: default; transform: none; }

  .de-card {
    background: var(--card-bg);
    border: 1px solid var(--border); border-radius: 12px;
    padding: 18px 20px; margin-bottom: 16px;
    box-shadow: var(--shadow-md);
    transition: border-color .2s ease;
  }
  .de-card h3 {
    margin: 0 0 14px 0; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--blue); font-weight: 800;
    display: flex; align-items: center; gap: 8px;
  }
  .de-card h3::before {
    content: ''; width: 3px; height: 13px; background: var(--blue); border-radius: 2px; display: inline-block;
  }

  .de-status { font-size: 12px; padding: 4px 10px; border-radius: 20px; font-weight: 600; font-family: var(--font-mono); }
  .de-status.new { background: var(--blue-glow); color: var(--blue); }
  .de-status.saved { background: rgba(56,199,147,0.14); color: var(--green); }
  .de-status.inactive { background: rgba(239,90,111,0.12); color: var(--red); }

  .de-grid-fields { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }

  table.de-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.de-table th {
    text-align: left; padding: 9px 10px; color: var(--text-faint); font-size: 10.5px;
    text-transform: uppercase; letter-spacing: 0.06em; border-bottom: 1px solid var(--border); font-weight: 700;
  }
  table.de-table td { padding: 8px 10px; border-bottom: 1px solid var(--table-border); transition: background .12s; }
  table.de-table tbody tr:hover td { background: var(--row-hover); }
  table.de-table tr:last-child td { border-bottom: none; }
  table.de-table input[type="number"], table.de-table input[type="text"] {
    width: 100%; background: var(--navy); border: 1px solid var(--border); color: var(--text);
    padding: 6px 8px; border-radius: 6px; font-family: var(--font-mono); font-size: 13px; outline: none;
    transition: border-color .15s, box-shadow .15s;
  }
  table.de-table input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px var(--blue-glow); }
  table.de-table .ent-name { color: var(--text); font-weight: 700; white-space: nowrap; }
  table.de-table .ent-loja { color: var(--text-faint); font-size: 11px; font-weight: 400; }
  table.de-table .computed-val { font-family: var(--font-mono); color: var(--green); font-weight: 700; }

  .de-kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; margin-bottom: 20px; }
  .de-kpi {
    position: relative; overflow: hidden;
    background: linear-gradient(155deg, var(--panel-raised) 0%, var(--panel) 100%);
    border: 1px solid var(--border); border-radius: 14px; padding: 18px 20px;
    box-shadow: var(--shadow-md);
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .de-kpi:hover { transform: translateY(-3px); border-color: var(--blue-dim); box-shadow: var(--shadow-lg); }
  .de-kpi::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px;
    background: linear-gradient(90deg, var(--blue), var(--blue-dim) 45%, transparent);
    opacity: 0.9;
  }
  .de-kpi .label {
    font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: 0.07em;
    font-weight: 700; margin-bottom: 10px; display: flex; align-items: center; gap: 7px; line-height: 1.35;
  }
  .de-kpi .label::before {
    content: ''; width: 5px; height: 5px; border-radius: 50%; flex: none;
    background: var(--blue); box-shadow: 0 0 0 3px var(--blue-glow);
  }
  .de-kpi .value { font-family: var(--font-mono); font-size: 27px; font-weight: 800; color: var(--text); letter-spacing: -0.02em; }
  .de-kpi .value.blue { color: var(--blue); }
  .de-kpi .value.green { color: var(--green); }
  .de-kpi .value.red { color: var(--red); }
  .de-kpi .delta { font-size: 11px; margin-top: 4px; font-family: var(--font-mono); font-weight: 700; }
  .de-kpi .delta.up { color: var(--green); }
  .de-kpi .delta.down { color: var(--red); }

  .de-hero {
    border-radius: 14px; padding: 22px 26px; margin-bottom: 22px; position: relative; overflow: hidden;
    background: var(--hero-bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-lg);
  }
  .de-hero-top { display:flex; align-items:baseline; justify-content:space-between; margin-bottom: 16px; flex-wrap:wrap; gap:8px; }
  .de-hero-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--blue); font-weight: 800; }
  .de-hero-sub { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); }
  .de-hero-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 20px; }
  .de-hero-stat .n { font-family: var(--font-mono); font-size: 30px; font-weight: 800; color: var(--text); line-height: 1; letter-spacing:-0.02em; }
  .de-hero-stat .l { font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-dim); margin-top: 6px; font-weight: 700; }

  .de-empty { text-align: center; padding: 40px 20px; color: var(--text-faint); }
  .de-empty .big { font-size: 32px; margin-bottom: 8px; }

  .de-badge { display: inline-block; padding: 2px 8px; border-radius: 20px; font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; }
  .de-badge.active { background: rgba(56,199,147,0.14); color: var(--green); }
  .de-badge.inactive { background: rgba(82,98,140,0.2); color: var(--text-faint); }

  .de-op-list-item {
    display: flex; align-items: center; justify-content: space-between; padding: 13px 16px;
    background: var(--panel); border: 1px solid var(--border); border-radius: 10px; margin-bottom: 8px;
    cursor: pointer; transition: all .15s; box-shadow: var(--shadow-sm);
  }
  .de-op-list-item:hover { border-color: var(--blue-dim); transform: translateX(2px); }
  .de-op-list-item .name { font-weight: 700; font-size: 14px; }
  .de-op-list-item .meta { font-size: 11px; color: var(--text-faint); font-family: var(--font-mono); margin-top: 3px; }

  .de-config-editor { border-top: 1px solid var(--border); margin-top: 14px; padding-top: 14px; }
  .de-tag-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
  .de-tag {
    display: flex; align-items: center; gap: 6px; background: var(--navy); border: 1px solid var(--border);
    padding: 5px 6px 5px 10px; border-radius: 20px; font-size: 12px;
  }
  .de-tag button { background: none; border: none; color: var(--text-faint); cursor: pointer; font-size: 13px; line-height: 1; padding: 2px; }
  .de-tag button:hover { color: var(--red); }
  .de-inline-add { display: flex; gap: 6px; margin-top: 6px; flex-wrap: wrap; }
  .de-inline-add input { flex: 1; min-width: 140px; }

  .de-loading { display: flex; align-items: center; justify-content: center; height: 300px; color: var(--text-faint); font-family: var(--font-mono); font-size: 13px; }

  .de-toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--panel-raised); border: 1px solid var(--blue);
    color: var(--text); padding: 10px 16px; border-radius: 8px; font-size: 13px; font-weight: 600;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4); z-index: 100; opacity: 0; transform: translateY(10px);
    transition: all .25s ease; pointer-events: none; max-width: 320px;
  }
  .de-toast.show { opacity: 1; transform: translateY(0); }

  .de-section-label { font-size: 12px; color: var(--text-dim); font-weight: 600; margin: 16px 0 8px 0; }
  .de-note { font-size: 12px; color: var(--text-faint); line-height: 1.5; }
  .de-chart-wrap { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px 18px; margin-bottom: 16px; }
  .de-flex-between { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; margin-bottom: 14px; }

  /* Fecho do dia banner */
  .de-fecho {
    border-radius: 12px; padding: 18px 22px; margin-bottom: 18px;
    background: linear-gradient(135deg, var(--blue-dim), var(--blue));
    display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 16px;
    box-shadow: 0 8px 30px rgba(59,111,224,0.25);
  }
  .de-fecho .fecho-title { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: rgba(255,255,255,0.8); font-weight: 700; margin-bottom: 4px; }
  .de-fecho .fecho-op { font-size: 16px; font-weight: 700; color: #fff; }
  .de-fecho .fecho-stats { display: flex; gap: 26px; flex-wrap: wrap; }
  .de-fecho .fecho-stat { text-align: right; }
  .de-fecho .fecho-stat .n { font-family: var(--font-mono); font-size: 26px; font-weight: 800; color: #fff; line-height:1; }
  .de-fecho .fecho-stat .l { font-size: 10px; text-transform: uppercase; letter-spacing: 0.06em; color: rgba(255,255,255,0.75); margin-top: 4px; font-weight: 700; }

  .de-subtabs { display: flex; gap: 6px; margin-bottom: 18px; }
  .de-subtab {
    padding: 7px 16px; font-size: 12px; font-weight: 700; border-radius: 22px; cursor: pointer;
    background: var(--panel); border: 1px solid var(--border); color: var(--text-dim); transition: all .15s;
  }
  .de-subtab:hover { color: var(--text); border-color: var(--blue-dim); }
  .de-subtab.active { background: linear-gradient(135deg, var(--blue-glow), rgba(59,111,224,0.08)); border-color: var(--blue); color: var(--blue); }

  .de-trend-badge { font-family: var(--font-mono); font-weight: 700; font-size: 12px; padding: 3px 8px; border-radius: 6px; }
  .de-trend-badge.up { color: var(--green); background: rgba(56,199,147,0.12); }
  .de-trend-badge.down { color: var(--red); background: rgba(239,90,111,0.12); }
  .de-trend-badge.flat { color: var(--text-faint); background: rgba(82,98,140,0.12); }
  .edr-bad { color: var(--red) !important; font-weight: 800; }
  .edr-mid { color: #d99a1c !important; font-weight: 800; }
  .edr-good { color: var(--green) !important; font-weight: 800; }
  .de-theme-toggle {
    width: 38px; height: 38px; border-radius: 10px; border: 1px solid var(--border);
    background: var(--panel); color: var(--text); font-size: 16px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-sm);
    transition: all .2s;
  }
  .de-theme-toggle:hover { border-color: var(--blue-dim); transform: translateY(-1px); }
  .de-header-right { display: flex; align-items: center; gap: 10px; }
  .de-live-clock {
    font-family: var(--font-mono); font-size: 11.5px; color: var(--text-faint); font-weight: 600;
    padding: 8px 12px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow-sm); white-space: nowrap;
  }
  .de-conn-status {
    font-family: var(--font-mono); font-size: 11px; font-weight: 700;
    padding: 8px 10px; background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
    box-shadow: var(--shadow-sm); white-space: nowrap;
  }
</style>
</head>
<body>

<div id="de-app-root">

let currentTheme = 'dark';
function chartAxis(){ return currentTheme==='light' ? '#666d7d' : '#5c626f'; }
function chartLegend(){ return currentTheme==='light' ? '#666d7d' : '#8d94a3'; }
function chartGrid(){ return currentTheme==='light' ? 'rgba(59,111,224,0.08)' : 'rgba(35,38,49,0.7)'; }
function chartBlue(){ return currentTheme==='light' ? '#3b6fe0' : '#3b6fe0'; }
function chartGreen(){ return currentTheme==='light' ? '#0a9d5c' : '#22c274'; }
function chartLabelText(){ return currentTheme==='light' ? '#12141c' : '#eef0f4'; }

let valueLabelsRegistered = false;
function deLabelBoxesOverlap(a,b){
  return a.left < b.right && a.right > b.left && a.top < b.bottom && a.bottom > b.top;
}
const valueLabelsPlugin = {
  id: 'deValueLabels',
  afterDatasetsDraw(chart){
    const {ctx} = chart;
    // Desenha primeiro todas as labels das barras, depois as da linha (EDR%)
    // por cima — assim o EDR nunca fica escondido atrás do número da barra.
    const order = chart.data.datasets.map((d,i)=>i).sort((a,b)=>{
      const ta = chart.getDatasetMeta(a).type === 'line' ? 1 : 0;
      const tb = chart.getDatasetMeta(b).type === 'line' ? 1 : 0;
      return ta-tb;
    });
    // Guarda as caixas já "ocupadas" neste render para nunca deixar duas
    // labels (ex: nº da barra e % da linha) ficarem sobrepostas. Começa já
    // com uma pequena zona reservada à volta de cada ponto da(s) linha(s) —
    // assim nenhuma label (nem a da própria barra) fica riscada por cima do
    // traço da linha quando a barra é muito alta e quase toca nela.
    const placedBoxes = [];
    chart.data.datasets.forEach((ds, i)=>{
      const m = chart.getDatasetMeta(i);
      if (m.hidden || m.type !== 'line') return;
      m.data.forEach(el=>{
        const p = el.tooltipPosition ? el.tooltipPosition() : el.getCenterPoint();
        const r = 7;
        placedBoxes.push({ left: p.x-r, right: p.x+r, top: p.y-r, bottom: p.y+r });
      });
    });
    const minBoxTop = chart.chartArea.top + 2;
    order.forEach(dsIndex=>{
      const dataset = chart.data.datasets[dsIndex];
      const meta = chart.getDatasetMeta(dsIndex);
      if (meta.hidden || dataset.hideLabels) return;
      const isLine = meta.type === 'line';
      meta.data.forEach((element, index)=>{
        const value = dataset.data[index];
        if (value===null || value===undefined) return;
        let label;
        if (dataset.labelSuffix === '%') label = (Math.round(value*10)/10) + '%';
        else label = Number.isInteger(value) ? String(value) : (Math.round(value*10)/10).toString();
        ctx.save();
        ctx.font = '700 10px Inter, sans-serif';
        ctx.textAlign = 'center';
        const textColor = isLine ? (dataset.borderColor || chartGreen()) : chartLabelText();
        const pos = element.tooltipPosition ? element.tooltipPosition() : element.getCenterPoint();
        const offset = isLine ? 14 : 6;
        const textW = ctx.measureText(label).width;
        const padX = 4, padY = 2, boxH = 13;

        // O número da barra fica sempre por dentro dela (perto do topo) —
        // assim nunca disputa espaço nem cruza com a linha do EDR% por cima.
        const insideBar = !isLine;

        let ty, box;
        if (insideBar){
          ctx.textBaseline = 'top';
          ty = pos.y + 6;
          box = { left: pos.x-textW/2-padX, right: pos.x+textW/2+padX, top: ty-padY, bottom: ty+boxH-padY };
        } else if (isLine && (pos.y - offset - boxH + padY) < minBoxTop){
          // Não há espaço para desenhar acima do ponto (linha perto do topo
          // do gráfico) — em vez de comprimir a label contra o limite (o que
          // a fazia ficar em cima da própria linha), desenha-se por baixo
          // do ponto.
          ctx.textBaseline = 'top';
          ty = pos.y + 8;
          box = { left: pos.x-textW/2-padX, right: pos.x+textW/2+padX, top: ty-padY, bottom: ty+boxH-padY };
          let guardB = 0;
          while (guardB < 10 && placedBoxes.some(b=>deLabelBoxesOverlap(b, box))){
            ty += (boxH + 2);
            box = { left: pos.x-textW/2-padX, right: pos.x+textW/2+padX, top: ty-padY, bottom: ty+boxH-padY };
            guardB++;
          }
        } else {
          ctx.textBaseline = 'bottom';
          ty = pos.y - offset;
          // Nunca deixar a label (nem o seu fundo) invadir a área acima do
          // gráfico (legenda/título) — se o ponto estiver perto do topo,
          // "empurra-se" a label para baixo até caber dentro da área do chart.
          if (ty - boxH + padY < minBoxTop){ ty = minBoxTop + boxH - padY; }
          box = { left: pos.x-textW/2-padX, right: pos.x+textW/2+padX, top: ty-boxH+padY, bottom: ty+padY };
          // Se esta label colidir com outra já desenhada (ex: % da linha em
          // cima do número da barra), sobe-a um pouco até deixar de colidir.
          let guard = 0;
          while (guard < 10 && placedBoxes.some(b=>deLabelBoxesOverlap(b, box))){
            ty -= (boxH + 2);
            if (ty - boxH + padY < minBoxTop){ ty = minBoxTop + boxH - padY; box = { left: box.left, right: box.right, top: ty-boxH+padY, bottom: ty+padY }; break; }
            box = { left: pos.x-textW/2-padX, right: pos.x+textW/2+padX, top: ty-boxH+padY, bottom: ty+padY };
            guard++;
          }
        }
        placedBoxes.push(box);
        // Fundo (chip) atrás do texto, para não se perder sobre barras/linhas
        ctx.fillStyle = currentTheme==='light' ? 'rgba(255,255,255,0.88)' : 'rgba(10,18,36,0.82)';
        ctx.beginPath();
        if (ctx.roundRect){ ctx.roundRect(box.left, box.top, box.right-box.left, box.bottom-box.top, 4); }
        else { ctx.rect(box.left, box.top, box.right-box.left, box.bottom-box.top); }
        ctx.fill();
        ctx.fillStyle = textColor;
        ctx.fillText(label, pos.x, ty);
        ctx.restore();
      });
    });
  }
};

// Separa visualmente as barras (Entregues) da linha (EDR%) para que nunca se
// cruzem: as barras ficam confinadas à faixa inferior (~58% da altura) e a
// linha do EDR% fica sempre numa faixa própria no topo. Faz isto ajustando os
// limites dos dois eixos (y = barras à esquerda, y1 = linha % à direita).
function applyBandedDualAxis(config){
  try {
    const ds = (config.data && config.data.datasets) || [];
    const hasLine = ds.some(d => d.type === 'line' && (d.yAxisID === 'y1' || d.yAxisID === undefined));
    const scales = config.options && config.options.scales;
    if (!scales || !scales.y || !scales.y1 || !hasLine) return;

    // Maior valor das barras (dataset de barras / eixo y)
    let maxBar = 0;
    ds.forEach(d => {
      if (d.type === 'bar'){
        d.data.forEach(v => { if (typeof v === 'number' && isFinite(v) && v > maxBar) maxBar = v; });
      }
    });

    // As barras enchem no máximo ~58% da altura -> topo do eixo com folga.
    const BAR_FILL = 0.58;
    if (maxBar > 0){
      let target = maxBar / BAR_FILL;
      // Arredonda para um valor "bonito" para os ticks ficarem legíveis.
      const mag = Math.pow(10, Math.floor(Math.log10(target)));
      target = Math.ceil(target / mag) * mag;
      scales.y.max = target;
    }
    scales.y.beginAtZero = true;

    // Eixo da linha (%): 100% no topo, 0% mapeado para ~62% da altura, com o
    // resto (faixa inferior) reservado às barras. Assim a linha vive sempre
    // acima das barras.
    scales.y1.min = -163;
    scales.y1.max = 100;
    const prevCb = (scales.y1.ticks && scales.y1.ticks.callback);
    scales.y1.ticks = scales.y1.ticks || {};
    // Esconde os ticks da zona negativa (que só existe para "empurrar" a linha).
    scales.y1.ticks.callback = function(v){
      if (v < 0) return '';
      return prevCb ? prevCb.call(this, v) : v + '%';
    };
    scales.y1.ticks.stepSize = scales.y1.ticks.stepSize || 25;
  } catch(e){ /* nunca bloquear o gráfico por causa disto */ }
}

// Safe chart creation: never let a missing/slow Chart.js library block the app.
// Retries briefly, then falls back to a plain message instead of hanging.
function safeChart(canvasId, config, retriesLeft){
  retriesLeft = retriesLeft===undefined ? 25 : retriesLeft;
  const canvas = document.getElementById(canvasId);
  if (!canvas) return null;
  if (typeof Chart === 'undefined'){
    if (retriesLeft > 0){
      setTimeout(()=>safeChart(canvasId, config, retriesLeft-1), 200);
    } else {
      const p = document.createElement('div');
      p.style.cssText = 'color:var(--text-faint);font-size:12px;padding:20px;text-align:center;';
      p.textContent = 'Gráfico indisponível (não foi possível carregar a biblioteca de gráficos — verifica a ligação à internet).';
      canvas.replaceWith(p);
    }
    return null;
  }
  try {
    if (!valueLabelsRegistered){
      Chart.register(valueLabelsPlugin);
      valueLabelsRegistered = true;
    }
    config.options = config.options || {};
    config.options.layout = config.options.layout || { padding: { top: 18 } };
    applyBandedDualAxis(config);
    const chart = new Chart(canvas.getContext('2d'), config);
    chartInstances.push(chart);
    return chart;
  } catch(e){
    console.error('chart error', e);
    return null;
  }
}

// ------------------------------------------------------------
// Estrutura:
//   appdata/config    -> { operations, importFlags, updatedAt }
//   records/{opId}    -> { entries: { "2026-07-16": {...} }, updatedAt }
//   auditLog/{autoId} -> { ts, user, action, details }
// Sincronização em tempo real via onSnapshot — qualquer pessoa a
// abrir o site vê as alterações de outra pessoa em poucos segundos,
// sem precisar de recarregar a página.
// ============================================================
function setConnStatus(ok){
  const el = document.getElementById('de-conn-status');
  if (!el) return;
  const dot='<svg viewBox="0 0 24 24" width="7" height="7" fill="currentColor" style="vertical-align:1px;color:'+(ok?'var(--green)':'var(--red)')+';"><circle cx="12" cy="12" r="10"/></svg>';
  el.innerHTML = dot+' '+(ok ? 'Sincronizado' : 'Sem ligação');
  el.title = ok ? 'Ligado ao Firebase — dados partilhados com a equipa' : 'Sem ligação ao Firebase — os dados podem não estar a guardar';
}

function isEditingNow(){
  const active = document.activeElement;
  const root = document.getElementById('de-app-root');
  return !!(active && root && root.contains(active) && (active.tagName==='INPUT' || active.tagName==='TEXTAREA' || active.isContentEditable));
}

// Contador de escritas de configuração em curso. Enquanto > 0, o listener
// em tempo real de 'appdata/config' ignora snapshots recebidos, para não
// sobrepor com dados desatualizados uma alteração local que ainda está a
// ser gravada (ex.: alguém a meio de "adicionar motorista" ou "renomear").
// Corrige o bug em que adicionar/editar motorista às vezes "não fazia
// efeito" — o snapshot antigo chegava entretanto e substituía STATE.operations
// pela versão sem a alteração, imediatamente antes do render() final.
let pendingConfigWrites = 0;

async function saveOperations(ops){
  STATE.operations = ops;
  pendingConfigWrites++;
  try {
    await db.collection('appdata').doc('config').set({
      operations: ops,
      importFlags: STATE.importFlags || {},
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    }, { merge: true });
    setConnStatus(true);
    ensureAllOpsHaveRecordsListener();
    ensurePesosListeners();
    return true;
  } catch(e){
    console.error('saveOperations falhou', e);
    setConnStatus(false);
    toast(ICONS.warning+' Não foi possível guardar — verifica a ligação à internet');
    return false;
  } finally {
    pendingConfigWrites = Math.max(0, pendingConfigWrites - 1);
  }
}

async function saveRecords(opId, records){
  STATE.recordsCache[opId] = records;
  try {
    await db.collection('records').doc(opId).set({
      entries: records,
      updatedAt: firebase.firestore.FieldValue.serverTimestamp()
    });
    setConnStatus(true);
    return true;
  } catch(e){
    console.error('saveRecords falhou', e);
    setConnStatus(false);
    toast(ICONS.warning+' Não foi possível guardar — verifica a ligação à internet');
    return false;
  }
}

async function savePesos(opId, entries, imports){

    return false;

}

const _recordsListeners = {};

async function migrateDhlVilarealRecords(){
  const op = STATE.operations.find(o=>o.id==='dhl_vilareal');
  if (!op || !op.repeating) return;
  const records = STATE.recordsCache['dhl_vilareal'] || {};
  let changed = false;
  Object.values(records).forEach(rec=>{
    if (!rec || !rec.entities) return;
    Object.values(rec.entities).forEach(ev=>{
      if (ev && ev.objectos !== undefined){
        if (ev.stops === undefined || ev.stops === null || ev.stops === ''){
          ev.stops = ev.objectos;
        }
        delete ev.objectos;
        changed = true;
      }
    });
  });
  if (changed){
    await saveRecords('dhl_vilareal', records);
    await logEdit('Migração automática', 'DHL Vila Real — campo "Objectos" convertido para "Stops Planeados" (dados preservados)');
  }
}

function ensureAllOpsHaveRecordsListener(){
  STATE.operations.forEach(op=>{
    if (_recordsListeners[op.id]) return;
    _recordsListeners[op.id] = db.collection('records').doc(op.id).onSnapshot(doc=>{
      STATE.recordsCache[op.id] = doc.exists ? (doc.data().entries || {}) : {};
      setConnStatus(true);
      if (op.id==='dhl_express') migrateDhlExpressRecords();
      if (op.id==='gls') migrateGlsRecords();
      if (op.id==='dhl_vilareal') migrateDhlVilarealRecords();
      if (!isEditingNow()) render();
    }, err=>{
      console.error('listener de registos falhou', op.id, err);
      setConnStatus(false);
    });
  });
}

const _pesosListeners = {};
function ensurePesosListeners(){
  pesosOps().forEach(opId=>{
    if (_pesosListeners[opId]) return;
    _pesosListeners[opId] = db.collection('pesos').doc(opId).onSnapshot(doc=>{
      STATE.pesosCache[opId] = doc.exists ? (doc.data().entries || {}) : {};
      STATE.pesosImports[opId] = doc.exists ? (doc.data().imports || {}) : {};
      STATE.pesosReent[opId] = doc.exists ? (doc.data().reentregas || {}) : {};
      setConnStatus(true);
      if (!isEditingNow() && STATE.tab==='pesos') render();
    }, err=>{
      console.error('listener de pesos falhou', opId, err);
      setConnStatus(false);
    });
  });
}

function setupRealtimeListeners(){
  db.collection('appdata').doc('config').onSnapshot(doc=>{
    if (pendingConfigWrites > 0){
      // Há uma gravação local em curso (ex.: acabámos de adicionar/renomear
      // um motorista) — ignora este snapshot para não a sobrepor. Assim que
      // a gravação terminar, o próprio código que a fez trata do render().
      setConnStatus(true);
      return;
    }
    if (doc.exists){
      const data = doc.data();
      STATE.operations = migrateOperations(data.operations && data.operations.length ? data.operations : defaultOperations());
      STATE.importFlags = data.importFlags || {};
    }
    ensureAllOpsHaveRecordsListener();
    ensurePesosListeners();
    setConnStatus(true);
    if (!isEditingNow()) render();
  }, err=>{
    console.error('listener de configuração falhou', err);
    setConnStatus(false);
  });

  db.collection('auditLog').orderBy('ts','desc').limit(300).onSnapshot(snap=>{
    STATE.auditLog = snap.docs.map(d=>d.data()).reverse();
    if (!isEditingNow() && STATE.tab==='historico') render();
  }, err=>{
    console.error('listener de histórico falhou', err);
  });

  ensurePesosListeners();
}

function todayISO(){
  const d = new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function fmt(n){
  if (n===null||n===undefined||isNaN(n)) return '—';
  return Math.round(n*100)/100 === Math.round(n) ? String(Math.round(n)) : (Math.round(n*10)/10).toString();
}
function pct(n){
  if (n===null||n===undefined||isNaN(n)) return '—';
  return (Math.round(n*1000)/10) + '%';
}
function edrHtml(edrFraction){
  // verde >= 95%, amarelo entre 90% e 95%, vermelho < 90% — usado em toda a app
  if (edrFraction===null || edrFraction===undefined || isNaN(edrFraction)) return '—';
  const cls = edrFraction < 0.9 ? 'edr-bad' : edrFraction < 0.95 ? 'edr-mid' : 'edr-good';
  return `<span class="${cls}">${pct(edrFraction)}</span>`;
}
function toast(msg){

function slug(str){
  return str.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'_').replace(/^_+|_+$/g,'');
}
function uid(){ return Math.random().toString(36).slice(2,9); }
function cssEscape(str){
  if (typeof CSS !== 'undefined' && CSS.escape) return CSS.escape(str);
  return String(str).replace(/[^a-zA-Z0-9_\u00C0-\u024F -]/g, c=>'\\'+c);
}
function monthName(m){
  return ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'][m-1];
}
function sectorYearOptions(){

// Plural em português (regras principais) — evita erros como "Regiãos".
function plural(word){
  if (!word) return word;
  const w = String(word);
  const lower = w.toLowerCase();
  if (/ão$/.test(lower)) return w.slice(0,-2) + 'ões';        // região -> regiões
  if (/(m)$/.test(lower)) return w.slice(0,-1) + 'ns';         // armazém -> armazéns
  if (/(r|z|n)$/.test(lower)) return w + 'es';                 // setor -> setores
  if (/(al|el|ol|ul)$/.test(lower)) return w.slice(0,-1) + 'is'; // local -> locais
  if (/il$/.test(lower)) return w.slice(0,-2) + 'is';          // funil -> funis
  if (/s$/.test(lower)) return w;                              // já plural / invariável
  return w + 's';                                              // loja -> lojas
}

function sumRoleForDate(op, dayRecord, role, entityFilter){
  if (!dayRecord) return 0;
  let entitySum = 0, hasEntityData = false;
  if (op.repeating){
    const entities = dayRecord.entities || {};
    op.repeating.fields.forEach(f=>{
      if (f.role===role){
        Object.keys(entities).forEach(ent=>{
          if (entityFilter && !entityFilter.has(ent)) return;
          const v = entities[ent] && entities[ent][f.key];
          if (v !== undefined && v !== null && v !== '') { entitySum += Number(v) || 0; hasEntityData = true; }
        });
      }
    });
  }
  if (hasEntityData) return entitySum;
  if (entityFilter) return 0; // registo é só por entidade — sem dados dela, não há fallback para "fixed"
  let fixedSum = 0;
  (op.fields||[]).forEach(f=>{
    if (f.role===role) fixedSum += Number(dayRecord.fixed && dayRecord.fixed[f.key]) || 0;
  });
  return fixedSum;
}
function dayEntregues(op, rec, entityFilter){ return sumRoleForDate(op, rec, 'entregues', entityFilter); }
function dayTotal(op, rec, entityFilter){
  const t = sumRoleForDate(op, rec, 'total', entityFilter);
  if (t) return t;
  const e = sumRoleForDate(op, rec, 'entregues', entityFilter);
  const n = sumRoleForDate(op, rec, 'nao_entregues', entityFilter);
  return e+n;
}
function dateRangeArray(days){
  const arr = [];
  const end = new Date();
  for (let i=days-1;i>=0;i--){
    const d = new Date(end);
    d.setDate(d.getDate()-i);
    arr.push(d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'));
  }
  return arr;
}
function daysInMonth(year, month){
  return new Date(year, month, 0).getDate();
}
// Projeta o total de "entregues" do mês, se ele ainda estiver em curso —
// usado para comparar de forma justa um mês parcial (ex.: dia 15) com um
// mês anterior já fechado, em vez de comparar "15 dias" com "30 dias".
function projectMonthEntregues(stats, year, month){
  const totalDays = daysInMonth(year, month);
  const t = todayISO();
  const isCurrent = year===Number(t.slice(0,4)) && month===Number(t.slice(5,7));
  if (isCurrent && stats.diasComRegisto>0 && stats.diasComRegisto<totalDays){
    return { value: stats.entregues/stats.diasComRegisto*totalDays, isProjected:true, dias:stats.diasComRegisto, totalDays };
  }
  return { value: stats.entregues, isProjected:false, dias:stats.diasComRegisto, totalDays };
}
function allDatesForMonth(year, month){
  const n = daysInMonth(year, month);
  const arr = [];
  for (let d=1; d<=n; d++){
    arr.push(year+'-'+String(month).padStart(2,'0')+'-'+String(d).padStart(2,'0'));
  }
  return arr;
}
function weekdayName(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return ['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'][d.getDay()];
}
function addDays(dateStr, delta){
  const d = new Date(dateStr+'T00:00:00');
  d.setDate(d.getDate()+delta);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function weekStartDate(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  const dow = (d.getDay()+6)%7; // dias desde segunda-feira
  d.setDate(d.getDate()-dow);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function groupDatesBy(dates, groupBy){
  // devolve [{ key, label, dates:[...] }] ordenado cronologicamente
  const map = {};
  dates.forEach(d=>{
    let key, label;
    if (groupBy==='week'){ key = weekStartDate(d); label = key.slice(8)+'/'+key.slice(5,7); }
    else if (groupBy==='month'){ key = d.slice(0,7); label = monthName(Number(d.slice(5,7))).slice(0,3)+'/'+d.slice(2,4); }
    else if (groupBy==='year'){ key = d.slice(0,4); label = key; }
    else { key = d; label = d.slice(5); }
    if (!map[key]) map[key] = { key, label, dates: [] };
    map[key].dates.push(d);
  });
  return Object.values(map).sort((a,b)=>a.key.localeCompare(b.key));
}

// Um motorista/entidade tem uma "janela" de atividade por data:
// - meta.createdFrom: se definido, não existe (nem para alertas) antes dessa data.
// - meta.inactivePeriods: lista de { from, to } — "to" null/undefined = ainda
//   inativo; quando é reativado, "to" passa a ser a data da reativação, e o
//   período fica fechado (preservado no histórico, não é apagado). Isto evita
//   que dias em que a pessoa esteve legitimamente desativada voltem a disparar
//   alerta de dados em falta depois de uma reativação meses depois.
// (mantém compatibilidade com o formato antigo meta.inactiveFrom de versões anteriores)
function isEntityActiveForDate(op, ent, dateStr){
  if (!op.repeating) return true;
  const meta = (op.repeating.entityMeta||{})[ent] || {};
  if (meta.createdFrom && dateStr < meta.createdFrom) return false;
  const periods = meta.inactivePeriods || (meta.inactiveFrom ? [{ from: addDays(meta.inactiveFrom,1), to: null }] : []);
  for (let i=0; i<periods.length; i++){
    const p = periods[i];
    if (dateStr >= p.from && (!p.to || dateStr < p.to)) return false;
  }
  return true;
}

// Move os dados guardados sob "oldName" (entities e absences, em TODOS os
// dias já gravados) para "newName". Isto é o que torna o "Renomear" um
// verdadeiro renomear: o motorista não fica com o nome antigo "preso" a
// dados antigos (o que fazia parecer que tinha sido desativado) — passa a
// ter um único histórico contínuo sob o nome novo.
function migrateEntityDataAcrossRecords(opId, oldName, newName){
  const recs = STATE.recordsCache[opId] || {};
  let touched = false;
  Object.keys(recs).forEach(date=>{
    const rec = recs[date];
    if (!rec) return;
    if (rec.entities && Object.prototype.hasOwnProperty.call(rec.entities, oldName)){
      const oldVals = rec.entities[oldName];
      rec.entities[newName] = rec.entities[newName] ? { ...oldVals, ...rec.entities[newName] } : oldVals;
      delete rec.entities[oldName];
      touched = true;
    }
    if (rec.absences && Object.prototype.hasOwnProperty.call(rec.absences, oldName)){
      rec.absences[newName] = rec.absences[oldName];
      delete rec.absences[oldName];
      touched = true;
    }
  });
  return touched ? recs : null;
}

// Migra também o rascunho (dia ainda não guardado) que possa estar aberto
// para a mesma operação, para não perder o que a pessoa estava a preencher.
function migrateEntityDataInDrafts(opId, oldName, newName){
  Object.keys(registoDrafts).forEach(key=>{
    if (!key.startsWith(opId+'|')) return;
    const d = registoDrafts[key];
    if (!d) return;
    if (d.entities && Object.prototype.hasOwnProperty.call(d.entities, oldName)){
      d.entities[newName] = d.entities[newName] ? { ...d.entities[oldName], ...d.entities[newName] } : d.entities[oldName];
      delete d.entities[oldName];
    }
    if (d.absences && Object.prototype.hasOwnProperty.call(d.absences, oldName)){
      d.absences[newName] = d.absences[oldName];
      delete d.absences[oldName];
    }
  });
}

// Motoristas do campo "responsável" (driverField) só devem poder ser
// escolhidos a partir da data em que foram adicionados — tal como acontece
// com os motoristas em operações "por motorista" (repeating). Sem isto, um
// motorista novo ficava logo selecionável em dias anteriores à sua criação.
function isDriverFieldActiveForDate(op, name, dateStr){
  const meta = op.driverField && op.driverField.meta && op.driverField.meta[name];
  if (!meta || !meta.createdFrom) return true; // motoristas antigos, sem data registada, continuam sempre disponíveis
  return dateStr >= meta.createdFrom;
}

function isEntityCurrentlyInactive(op, ent){
  const meta = (op.repeating.entityMeta||{})[ent] || {};
  const periods = meta.inactivePeriods || (meta.inactiveFrom ? [{ from: addDays(meta.inactiveFrom,1), to: null }] : []);
  return periods.some(p=>!p.to);
}
function currentInactivePeriod(op, ent){
  const meta = (op.repeating.entityMeta||{})[ent] || {};
  const periods = meta.inactivePeriods || (meta.inactiveFrom ? [{ from: addDays(meta.inactiveFrom,1), to: null }] : []);
  return periods.find(p=>!p.to) || null;
}

function renderFechoBanner(op, fixedVals, entityVals){
  function roleTotal(role){
    let entitySum = 0, hasEntityData = false;
    if (op.repeating){
      op.repeating.fields.forEach(f=>{
        if (f.role===role){
          Object.values(entityVals).forEach(ev=>{
            const v = ev && ev[f.key];
            if (v !== undefined && v !== null && v !== '') { entitySum += Number(v) || 0; hasEntityData = true; }
          });
        }
      });
    }
    if (hasEntityData) return entitySum;
    let fixedSum = 0;
    (op.fields||[]).forEach(f=>{ if (f.role===role) fixedSum += Number(fixedVals[f.key]) || 0; });
    return fixedSum;
  }
  const entregues = roleTotal('entregues');
  let total = roleTotal('total');
  const naoEnt = roleTotal('nao_entregues');
  if (!total) total = entregues + naoEnt;
  const edr = total>0 ? entregues/total : null;
  const banner = document.createElement('div');
  banner.className = 'de-fecho';
  banner.id = 'fecho-banner';
  banner.innerHTML = `
    <div>
      <div class="fecho-title">Fecho do dia</div>
      <div class="fecho-op">${op.name} · ${registoSel.date.split('-').reverse().join('/')}</div>
    </div>
    <div class="fecho-stats">
      <div class="fecho-stat"><div class="n" id="fecho-entregues">${fmt(entregues)}</div><div class="l">Entregues</div></div>
      <div class="fecho-stat"><div class="n" id="fecho-total">${total? fmt(total):'—'}</div><div class="l">Total</div></div>
      <div class="fecho-stat"><div class="n" id="fecho-edr">${edr!==null?edrHtml(edr):'—'}</div><div class="l">EDR%</div></div>
    </div>
  `;
  return banner;
}

function recomputeFecho(op, wrap){
  const fixedVals = {}, entityVals = {};
  wrap.querySelectorAll('[data-fixed-key]').forEach(inp=>{ fixedVals[inp.dataset.fixedKey] = inp.value; });
  wrap.querySelectorAll('[data-entity]').forEach(inp=>{
    entityVals[inp.dataset.entity] = entityVals[inp.dataset.entity] || {};
    entityVals[inp.dataset.entity][inp.dataset.entityKey] = inp.value;
  });
  const old = document.getElementById('fecho-banner');
  const fresh = renderFechoBanner(op, fixedVals, entityVals);
  if (old) old.replaceWith(fresh);
}

function renderRegisto(){
  const body = document.getElementById('de-body');
  const activeOps = STATE.operations.filter(o=>o.active).sort((a,b)=>a.name.localeCompare(b.name));
  if ((!registoSel.opId || !activeOps.some(o=>o.id===registoSel.opId)) && activeOps.length) registoSel.opId = activeOps[0].id;

  const wrap = document.createElement('div');

  const row = document.createElement('div');
  row.className = 'de-row';

  row.innerHTML = `
    <div class="de-field">
      <label>Cliente / Operação</label>
      <select id="reg-op"></select>
    </div>
    <div class="de-field">
      <label>Data</label>

    <div id="reg-status-holder"></div>
    <button class="de-btn ghost small" id="reg-edit-op" style="margin-left:auto;">${ICONS.gear} Editar campos desta operação</button>
